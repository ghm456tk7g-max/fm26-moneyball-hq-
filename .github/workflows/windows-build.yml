name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer
        run: npm run dist:win
      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = Resolve-Path "release/FM26_Moneyball_HQ_Setup.exe"
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exit code: $($install.ExitCode)" }

          $appPath = Join-Path $env:LOCALAPPDATA "Programs/FM26 MONEYBALL HQ/FM26 MONEYBALL HQ.exe"
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) "FM26 MONEYBALL HQ.lnk"
          $startLink = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/FM26 MONEYBALL HQ.lnk"
          if (-not (Test-Path $appPath)) { throw "Installed executable missing: $appPath" }
          if (-not (Test-Path $desktopLink)) { throw "Desktop shortcut missing" }
          if (-not (Test-Path $startLink)) { throw "Start Menu shortcut missing" }

          $smokeCsv = (Resolve-Path "sample-data/fm26-import-smoke.csv").Path
          $smokeResult = Join-Path $env:RUNNER_TEMP "fm26-installed-import-smoke.json"
          $env:FM26_IMPORT_SMOKE_RESULT = $smokeResult
          $app = Start-Process -FilePath $appPath -ArgumentList @("--import-smoke=$smokeCsv") -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            $logPath = Join-Path $env:APPDATA "fm26-moneyball-hq/logs/app.log"
            Write-Host "Installed application exit code: $($app.ExitCode)"
            if (Test-Path $smokeResult) {
              Write-Host "Import smoke result:"
              Get-Content $smokeResult -Raw
            }
            if (Test-Path $logPath) {
              Write-Host "Application log:"
              Get-Content $logPath
            } else {
              Write-Host "Application log was not created: $logPath"
            }
            throw "Installed application exited during first launch (code $($app.ExitCode))"
          }
          if (-not (Test-Path $smokeResult)) { throw "Installed application did not finish the CSV import smoke test" }
          $importResult = Get-Content $smokeResult -Raw | ConvertFrom-Json
          if (-not $importResult.ok -or $importResult.rowCount -ne 18) { throw "Installed CSV import failed: $(Get-Content $smokeResult -Raw)" }
          $database = Join-Path $env:APPDATA "fm26-moneyball-hq/moneyball-hq.sqlite"
          if (-not (Test-Path $database)) { throw "User database was not created" }
          taskkill /PID $app.Id /T /F | Out-Null

          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed application exited during second launch" }
          taskkill /PID $app.Id /T /F | Out-Null

          $uninstaller = Join-Path (Split-Path $appPath) "Uninstall FM26 MONEYBALL HQ.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code: $($uninstall.ExitCode)" }
          if (-not (Test-Path $database)) { throw "Uninstall unexpectedly deleted user data" }
      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM26-MONEYBALL-HQ-Windows
          path: release/*.exe
          if-no-files-found: error
